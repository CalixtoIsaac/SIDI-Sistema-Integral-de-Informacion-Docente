<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Proyecto</title>

  <script src="/js/theme.js"></script>
  <!-- Sin sesión, de vuelta al login antes de pintar nada -->
  <script>try { if (!localStorage.getItem('app.token')) location.replace('/'); } catch (e) { location.replace('/'); }</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar-brand">
        <span class="brand-mark sm" aria-hidden="true"><span data-icon="logo"></span></span>
        <span class="brand-name">Mi Proyecto</span>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section">General</p>
        <a class="nav-link" href="#inicio" data-view="inicio"><span data-icon="home"></span>Inicio</a>
        <a class="nav-link" href="#notas" data-view="notas"><span data-icon="notes"></span>Notas</a>
        <!-- Agrega aquí los enlaces de tus módulos nuevos -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="userAvatar" aria-hidden="true"></span>
          <div class="user-meta">
            <strong id="userName"></strong>
            <span id="userHandle" class="muted"></span>
          </div>
        </div>
        <button class="btn btn-ghost btn-block nav-logout" id="logoutBtn" type="button">
          <span data-icon="logout"></span>Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button"
                aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <span data-icon="menu"></span>
        </button>
        <h1 class="topbar-title" id="pageTitle">Inicio</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Orden de carga: utilidades → módulos → app.js (que los registra) -->
  <script src="/js/ui-kit.js"></script>
  <script src="/js/notas.js"></script>
  <script src="/js/inicio.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
