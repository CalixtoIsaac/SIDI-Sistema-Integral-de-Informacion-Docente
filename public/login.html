<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Mi Proyecto</title>

  <!-- El tema va primero para evitar el destello del tema incorrecto -->
  <script src="/js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth-page">
  <button class="btn btn-ghost btn-icon theme-toggle-fixed" type="button" data-theme-toggle></button>

  <main class="auth-wrap">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true"><span data-icon="logo"></span></span>
      <span class="brand-name">Mi Proyecto</span>
    </div>

    <section class="card auth-card" aria-labelledby="authTitle">
      <header class="auth-header">
        <h1 id="authTitle">Inicia sesión</h1>
        <p id="authSubtitle" class="muted">Escribe tus datos para entrar a tu espacio de trabajo.</p>
      </header>

      <div id="authAlert" class="alert" role="alert" hidden></div>

      <div id="authLoading" class="auth-loading"><span class="spinner" aria-label="Cargando"></span></div>

      <!-- Inicio de sesión -->
      <form id="loginForm" class="form" hidden>
        <div class="field">
          <label for="loginUser">Usuario</label>
          <input class="input" id="loginUser" name="usuario" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">Contraseña</label>
          <div class="input-group">
            <input class="input" id="loginPass" name="password" type="password" autocomplete="current-password" required>
            <button class="input-addon" type="button" data-toggle-password="loginPass"></button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      </form>

      <!-- Primera vez: crear la cuenta -->
      <form id="setupForm" class="form" hidden>
        <div class="field">
          <label for="setupName">Nombre</label>
          <input class="input" id="setupName" name="nombre" autocomplete="name" maxlength="60" required>
        </div>
        <div class="field">
          <label for="setupUser">Usuario</label>
          <input class="input" id="setupUser" name="usuario" autocomplete="username"
                 pattern="[A-Za-z0-9._\-]{3,30}" title="De 3 a 30 caracteres: letras, números, punto, guion o guion bajo" required>
          <p class="hint">De 3 a 30 caracteres, sin espacios.</p>
        </div>
        <div class="field">
          <label for="setupPass">Contraseña</label>
          <div class="input-group">
            <input class="input" id="setupPass" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            <button class="input-addon" type="button" data-toggle-password="setupPass"></button>
          </div>
          <p class="hint">Mínimo 8 caracteres.</p>
        </div>
        <div class="field">
          <label for="setupConfirm">Confirmar contraseña</label>
          <input class="input" id="setupConfirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Crear cuenta y entrar</button>
      </form>
    </section>

    <p class="auth-footer muted">Plantilla base · Express + SQLite</p>
  </main>

  <script src="/js/ui-kit.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
